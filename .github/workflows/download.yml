name: Video Downloader

on:
  repository_dispatch:
    types: [video-download]
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL"
        required: true
        type: string
      platform:
        description: "Platform (youtube/instagram/facebook/tiktok)"
        required: false
        type: string
      requestId:
        description: "Request ID (optional)"
        required: false
        type: string
      callbackUrl:
        description: "Callback URL (optional)"
        required: false
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: pip install --quiet --upgrade yt-dlp

      - name: Configure yt-dlp
        run: |
          mkdir -p ~/.config/yt-dlp && echo '--remote-components ejs:github' > ~/.config/yt-dlp/config && echo '--extractor-args youtube:player_client=default,android,tv,mweb' >> ~/.config/yt-dlp/config

      - name: Run downloader
        env:
          VIDEO_URL: ${{ github.event.client_payload.url || inputs.url || '' }}
          PLATFORM: ${{ github.event.client_payload.platform || inputs.platform || '' }}
          REQUEST_ID: ${{ github.event.client_payload.requestId || inputs.requestId || '' }}
          CALLBACK_URL: ${{ inputs.callbackUrl || github.event.client_payload.callbackUrl || secrets.CALLBACK_URL || '' }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET || '' }}
        run: python scripts/download_video.py
